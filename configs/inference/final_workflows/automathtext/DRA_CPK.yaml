experiment:
  name: dra_cpk_automathtext
  output_dir: outputs/inference/final_workflows/automathtext/dra_cpk
project:
  run_name: dra_cpk_automathtext
  output_root: outputs/inference
  seed: 1337
dataset:
  name: automathtext
  modality: text
  target_split: train_full
models:
  target:
    checkpoint_dir: completed_runs/automathtext/baseline_full_lora__20260505-051327-wjnx
  draft_p:
    checkpoint_dir: completed_runs/automathtext/baseline_full_lora__20260505-051327-wjnx
  shard_q1:
    checkpoint_dir: completed_runs/automathtext/shard1_lora__20260505-055526-ts74
  shard_q2:
    checkpoint_dir: completed_runs/automathtext/shard2_lora__20260505-061208-1vt6
cache:
  output_dir: outputs/inference/final_workflows/automathtext/dra_cpk
  overwrite: false
cpk:
  enabled: true
  acceptance_rates:
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  compute_inline: false
dra_generation:
  target_limit: 1000
  num_candidates_per_target: 10
  target_batch_size: 5
generation:
  max_new_tokens: 512
  temperature: 1.0
  top_p: 0.95
  top_k: 50
  do_sample: true
minkpp:
  k_percent_grid:
  - 5
  - 10
  - 20
  - 30
  - 40
  - 50
  default_k_percent: 20
  epsilon: 1.0e-08
mia:
  batch_size: 16
  max_sequence_tokens: 512
dra_distance:
  text_metrics:
  - normalized_levenshtein
  - bleu
  - bertscore_f1
  - rouge_l
  batch_size: 32
  text_chunk_size: 128
  text_num_workers: 16
  bertscore_batch_size: 32
  bertscore_half_precision: true
  bertscore_deduplicate_pairs: true
  bertscore_lang: en
  rouge_l_use_stemmer: true
runtime:
  device: cuda
  text_compile_model: false
  text_attention_implementation: flash_attention_3
wandb:
  enabled: true
  project: copyright-paper
  entity: null
  run_name: null
  tags:
  - dra
  - final_dra
  - automathtext
  - text
  - cpk
